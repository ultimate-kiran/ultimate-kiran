<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
  <title id="t">Kiran, forward deployed engineer</title>
  <desc id="d">The name Kiran drawn by a plotter on a blueprint, next to an isometric agent graph (start, plan, claude, tools, end) that runs in a loop while a trace log records each step.</desc>
  
  <defs>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#1E4A7A" stroke-width="0.6" opacity="0.35"/>
    </pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minor)"/>
      <path d="M100 0H0V100" fill="none" stroke="#1E4A7A" stroke-width="1" opacity="0.6"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#0A2342" stop-opacity="0"/>
      <stop offset="100%" stop-color="#051428" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="600" fill="#0A2342"/>
  <rect width="1200" height="600" fill="url(#major)"/>
  <rect width="1200" height="600" fill="url(#vignette)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9" fill="none" stroke="#7FA7D6" stroke-width="1.6"/>
    </marker>
  </defs>
  <style>
    .guide{stroke:#7FA7D6;stroke-width:1;stroke-dasharray:2 6;opacity:.55}
    .dim{stroke:#7FA7D6;stroke-width:1.2;fill:none}
    .dimtext{font:500 17px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#7FA7D6;letter-spacing:.4px}
    .pen{fill:none;stroke:#E8F1FF;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:0;animation:draw .55s cubic-bezier(.6,.1,.3,1) both}
    .spark{fill:none;stroke:#FFB000;stroke-width:12;stroke-linecap:round;stroke-dasharray:0 1;opacity:0;filter:url(#glow);animation:spark .55s cubic-bezier(.6,.1,.3,1) both}
    @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    @keyframes spark{0%{stroke-dasharray:.001 1;stroke-dashoffset:0;opacity:1}99%{stroke-dasharray:.001 1;stroke-dashoffset:-.999;opacity:1}100%{opacity:0}}
    .lede{font:600 27px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#E8F1FF}
    .sub{font:400 19px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#7FA7D6}
    .plane line{stroke:#1E4A7A;stroke-width:.8;opacity:.7}
    .edges line{stroke:#7FA7D6;stroke-width:2;stroke-dasharray:6 5;animation:flow 1.2s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-11}}
    .node .left{fill:#0c2748;stroke:#7FA7D6;stroke-width:1.2}
    .node .right{fill:#11335d;stroke:#7FA7D6;stroke-width:1.2}
    .node .top{fill:#143a68;stroke:#E8F1FF;stroke-width:1.4}
    .nlabel{font:600 16px 'Cascadia Code','Cascadia Mono',Consolas,'SFMono-Regular',Menlo,monospace;fill:#E8F1FF;text-anchor:middle}
    .row text{font:14.5px 'Cascadia Code','Cascadia Mono',Consolas,'SFMono-Regular',Menlo,monospace;fill:#E8F1FF}
    .row .who{fill:#FFB000}
    .logrule{stroke:#1E4A7A;stroke-width:1}
    .logtitle{font:600 13px 'Cascadia Code','Cascadia Mono',Consolas,'SFMono-Regular',Menlo,monospace;fill:#7FA7D6}
    @keyframes lit-start{0%{fill:#143a68;transform:translateY(0)}0.1%{fill:#143a68;transform:translateY(0)}1.2%{fill:#FFB000;transform:translateY(-7px)}7%{fill:#143a68;transform:translateY(0)}100%{fill:#143a68;transform:translateY(0)}}.n-start .top{animation:lit-start 12s linear infinite}.n-start{animation:lift-start 12s linear infinite}@keyframes lift-start{0%{transform:translateY(0)}0.1%{transform:translateY(0)}1.2%{transform:translateY(-7px)}7%{transform:translateY(0)}100%{transform:translateY(0)}}@keyframes lit-plan{0%{fill:#143a68;transform:translateY(0)}10.4%{fill:#143a68;transform:translateY(0)}12%{fill:#FFB000;transform:translateY(-7px)}17.8%{fill:#143a68;transform:translateY(0)}100%{fill:#143a68;transform:translateY(0)}}.n-plan .top{animation:lit-plan 12s linear infinite}.n-plan{animation:lift-plan 12s linear infinite}@keyframes lift-plan{0%{transform:translateY(0)}10.4%{transform:translateY(0)}12%{transform:translateY(-7px)}17.8%{transform:translateY(0)}100%{transform:translateY(0)}}@keyframes lit-tools{0%{fill:#143a68;transform:translateY(0)}32.1%{fill:#143a68;transform:translateY(0)}33.7%{fill:#FFB000;transform:translateY(-7px)}39.5%{fill:#143a68;transform:translateY(0)}53.8%{fill:#143a68;transform:translateY(0)}55.4%{fill:#FFB000;transform:translateY(-7px)}61.2%{fill:#143a68;transform:translateY(0)}100%{fill:#143a68;transform:translateY(0)}}.n-tools .top{animation:lit-tools 12s linear infinite}.n-tools{animation:lift-tools 12s linear infinite}@keyframes lift-tools{0%{transform:translateY(0)}32.1%{transform:translateY(0)}33.7%{transform:translateY(-7px)}39.5%{transform:translateY(0)}53.8%{transform:translateY(0)}55.4%{transform:translateY(-7px)}61.2%{transform:translateY(0)}100%{transform:translateY(0)}}@keyframes lit-claude{0%{fill:#143a68;transform:translateY(0)}21.3%{fill:#143a68;transform:translateY(0)}22.9%{fill:#FFB000;transform:translateY(-7px)}28.7%{fill:#143a68;transform:translateY(0)}42.9%{fill:#143a68;transform:translateY(0)}44.5%{fill:#FFB000;transform:translateY(-7px)}50.3%{fill:#143a68;transform:translateY(0)}64.6%{fill:#143a68;transform:translateY(0)}66.2%{fill:#FFB000;transform:translateY(-7px)}72%{fill:#143a68;transform:translateY(0)}100%{fill:#143a68;transform:translateY(0)}}.n-claude .top{animation:lit-claude 12s linear infinite}.n-claude{animation:lift-claude 12s linear infinite}@keyframes lift-claude{0%{transform:translateY(0)}21.3%{transform:translateY(0)}22.9%{transform:translateY(-7px)}28.7%{transform:translateY(0)}42.9%{transform:translateY(0)}44.5%{transform:translateY(-7px)}50.3%{transform:translateY(0)}64.6%{transform:translateY(0)}66.2%{transform:translateY(-7px)}72%{transform:translateY(0)}100%{transform:translateY(0)}}@keyframes lit-end{0%{fill:#143a68;transform:translateY(0)}75.4%{fill:#143a68;transform:translateY(0)}77%{fill:#FFB000;transform:translateY(-7px)}82.8%{fill:#143a68;transform:translateY(0)}100%{fill:#143a68;transform:translateY(0)}}.n-end .top{animation:lit-end 12s linear infinite}.n-end{animation:lift-end 12s linear infinite}@keyframes lift-end{0%{transform:translateY(0)}75.4%{transform:translateY(0)}77%{transform:translateY(-7px)}82.8%{transform:translateY(0)}100%{transform:translateY(0)}}
    @keyframes row0{0%,0%{opacity:0;transform:translateX(-6px)}2%,93%{opacity:1;transform:translateX(0)}100%{opacity:0}}.row0{animation:row0 12s linear infinite}@keyframes row1{0%,10.6%{opacity:0;transform:translateX(-6px)}12.8%,93%{opacity:1;transform:translateX(0)}100%{opacity:0}}.row1{animation:row1 12s linear infinite}@keyframes row2{0%,21.5%{opacity:0;transform:translateX(-6px)}23.7%,93%{opacity:1;transform:translateX(0)}100%{opacity:0}}.row2{animation:row2 12s linear infinite}@keyframes row3{0%,32.3%{opacity:0;transform:translateX(-6px)}34.5%,93%{opacity:1;transform:translateX(0)}100%{opacity:0}}.row3{animation:row3 12s linear infinite}@keyframes row4{0%,43.1%{opacity:0;transform:translateX(-6px)}45.3%,93%{opacity:1;transform:translateX(0)}100%{opacity:0}}.row4{animation:row4 12s linear infinite}@keyframes row5{0%,54%{opacity:0;transform:translateX(-6px)}56.2%,93%{opacity:1;transform:translateX(0)}100%{opacity:0}}.row5{animation:row5 12s linear infinite}@keyframes row6{0%,64.8%{opacity:0;transform:translateX(-6px)}67%,93%{opacity:1;transform:translateX(0)}100%{opacity:0}}.row6{animation:row6 12s linear infinite}@keyframes row7{0%,75.6%{opacity:0;transform:translateX(-6px)}77.8%,93%{opacity:1;transform:translateX(0)}100%{opacity:0}}.row7{animation:row7 12s linear infinite}
    @media (prefers-reduced-motion: reduce){
      .pen,.spark,.edges line,.node,.node .top,.row{animation:none!important}
      .spark{opacity:0}
    }
  </style>

  <!-- drafting guidelines and the plotter-drawn name -->
  <line class="guide" x1="40" y1="70" x2="566" y2="70"/>
  <line class="guide" x1="40" y1="190" x2="566" y2="190"/>
  <g><path class="pen" d="M0 0V120" transform="translate(64 70)" pathLength="1" style="animation-delay:0.3s"/><path class="pen" d="M72 0L4 70" transform="translate(64 70)" pathLength="1" style="animation-delay:0.6s"/><path class="pen" d="M24 48L78 120" transform="translate(64 70)" pathLength="1" style="animation-delay:0.9s"/><path class="pen" d="M0 0V120" transform="translate(178 70)" pathLength="1" style="animation-delay:1.2s"/><path class="pen" d="M0 120V0H44A30 30 0 0 1 44 60H0" transform="translate(216 70)" pathLength="1" style="animation-delay:1.5s"/><path class="pen" d="M36 60L76 120" transform="translate(216 70)" pathLength="1" style="animation-delay:1.7s"/><path class="pen" d="M0 120L42 0L84 120" transform="translate(328 70)" pathLength="1" style="animation-delay:2s"/><path class="pen" d="M15 78H69" transform="translate(328 70)" pathLength="1" style="animation-delay:2.3s"/><path class="pen" d="M0 120V0L76 120V0" transform="translate(450 70)" pathLength="1" style="animation-delay:2.6s"/><path class="spark" d="M0 0V120" transform="translate(64 70)" pathLength="1" style="animation-delay:0.3s"/><path class="spark" d="M72 0L4 70" transform="translate(64 70)" pathLength="1" style="animation-delay:0.6s"/><path class="spark" d="M24 48L78 120" transform="translate(64 70)" pathLength="1" style="animation-delay:0.9s"/><path class="spark" d="M0 0V120" transform="translate(178 70)" pathLength="1" style="animation-delay:1.2s"/><path class="spark" d="M0 120V0H44A30 30 0 0 1 44 60H0" transform="translate(216 70)" pathLength="1" style="animation-delay:1.5s"/><path class="spark" d="M36 60L76 120" transform="translate(216 70)" pathLength="1" style="animation-delay:1.7s"/><path class="spark" d="M0 120L42 0L84 120" transform="translate(328 70)" pathLength="1" style="animation-delay:2s"/><path class="spark" d="M15 78H69" transform="translate(328 70)" pathLength="1" style="animation-delay:2.3s"/><path class="spark" d="M0 120V0L76 120V0" transform="translate(450 70)" pathLength="1" style="animation-delay:2.6s"/></g>

  <!-- dimension line under the name carries the role -->
  <g class="dim">
    <path d="M64 212V232M526 212V232"/>
    <path d="M64 222H100M490 222H526"/>
  </g>
  <text class="dimtext" x="295" y="228" text-anchor="middle">forward deployed engineer</text>

  <text class="lede" x="64" y="286">I build AI agents that leave the demo</text>
  <text class="lede" x="64" y="320">and ship to production.</text>

  <!-- trace log -->
  <line class="logrule" x1="64" y1="376" x2="494" y2="376"/>
  <text class="logtitle" x="64" y="368">agent run, npm/cli#10362</text>
  <g class="row row0"><text x="64" y="404"><tspan class="who">start  </tspan><tspan>issue: uninstall says "up to date"</tspan></text></g><g class="row row1"><text x="64" y="426"><tspan class="who">plan   </tspan><tspan>reproduce, find the cause, fix, test</tspan></text></g><g class="row row2"><text x="64" y="448"><tspan class="who">claude </tspan><tspan>the reify diff never lists removals</tspan></text></g><g class="row row3"><text x="64" y="470"><tspan class="who">tools  </tspan><tspan>repro: 4 removed, 0 reported</tspan></text></g><g class="row row4"><text x="64" y="492"><tspan class="who">claude </tspan><tspan>report the orphan sweep in the diff</tspan></text></g><g class="row row5"><text x="64" y="514"><tspan class="who">tools  </tspan><tspan>tests pass, coverage 100%</tspan></text></g><g class="row row6"><text x="64" y="536"><tspan class="who">claude </tspan><tspan>write up the change</tspan></text></g><g class="row row7"><text x="64" y="558"><tspan class="who">end    </tspan><tspan>pull request #10362 opened</tspan></text></g>

