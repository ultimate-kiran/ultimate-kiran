<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 380" width="600" height="380" role="img" aria-labelledby="t d"><title id="t">Multi-Agent Document Processor</title><desc id="d">Project, 2026. Four LangGraph agents classify, extract and validate invoices, resumes and contracts, with confidence scores.</desc>
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#170E40"/><stop offset="1" stop-color="#090620"/></linearGradient>
    <linearGradient id="holo" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="380">
      <stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#E879F9"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 300 170" to="360 300 170" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="core"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6"/></radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect x="10" y="14" width="580" height="350" rx="22"/></clipPath>
    <filter id="g" filterUnits="userSpaceOnUse" x="0" y="0" width="600" height="380"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .float{animation:float 6s ease-in-out infinite alternate;animation-delay:1.8s}
    @keyframes float{from{transform:translateY(4px)}to{transform:translateY(-6px)}}
    .ctx{font:600 14px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#67E8F9}
    .ttl{font:700 29px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#F5F3FF}
    .desc{font:400 16.5px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#C4B5FD}
    .chip{fill:rgba(139,92,246,.16);stroke:rgba(196,181,253,.45);stroke-width:1}
    .chipt{font:500 13px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#F5F3FF;text-anchor:middle}
    .cap{font:500 12px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#C4B5FD;text-anchor:middle;opacity:.85}
    .orbit{fill:none;stroke:#C4B5FD;stroke-opacity:.2;stroke-dasharray:3 6}
    .spoke{stroke:#C4B5FD;stroke-opacity:.35;stroke-width:1.2}
    .agent{animation:blink 2.8s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:.6}50%{opacity:1}}
    .win{fill:rgba(18,11,51,.9);stroke:#22D3EE;stroke-width:2}
    .pipe{stroke:#8B5CF6;stroke-width:2;stroke-dasharray:4 5;animation:flow 1s linear infinite}
    .flow{fill:none;stroke:#8B5CF6;stroke-width:2;stroke-dasharray:4 5;animation:flow 1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-9}}
    .brace{font:700 40px 'Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace;fill:#E879F9;text-anchor:middle}
    .check{fill:none;stroke:#22D3EE;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;animation:tick 2.4s ease-out infinite}
    @keyframes tick{0%,35%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
    .scan{animation:scan 2.6s ease-in-out infinite alternate}
    @keyframes scan{from{transform:translateY(0)}to{transform:translateY(122px)}}
    .field{opacity:0;animation:field 4.5s ease-out infinite}
    @keyframes field{0%{opacity:0;transform:translateX(-8px)}12%,85%{opacity:1;transform:none}100%{opacity:0}}
    .sweep{animation:sweep 7s ease-in-out infinite;animation-delay:1.8s}
    @keyframes sweep{0%,55%{transform:translateX(-260px) skewX(-20deg)}100%{transform:translateX(760px) skewX(-20deg)}}
    @media (prefers-reduced-motion: reduce){.float,.agent,.pipe,.flow,.check,.scan,.field,.sweep{animation:none!important}}
    @media (prefers-reduced-motion: reduce){.field{opacity:1}}
  </style>
  <g class="float">
    <rect x="10" y="14" width="580" height="350" rx="22" fill="url(#cardBg)"/>
    <g clip-path="url(#clip)">
      <circle cx="470" cy="205" r="150" fill="#8B5CF6" opacity=".12"/>
      <rect class="sweep" x="0" y="0" width="160" height="380" fill="url(#sweep)"/>
    </g>
    <rect x="10" y="14" width="580" height="350" rx="22" fill="none" stroke="url(#holo)" stroke-width="1.6"/>
    <text x="40" y="58" class="ctx">Project, 2026</text>
    <text x="40" y="98" class="ttl">Multi-Agent Document</text><text x="40" y="132" class="ttl">Processor</text>
    <text x="40" y="172" class="desc">Four LangGraph agents classify, extract</text><text x="40" y="197" class="desc">and validate invoices, resumes and</text><text x="40" y="222" class="desc">contracts, with confidence scores.</text>
    <g><rect x="40" y="256" width="92.2" height="26" rx="13" class="chip"/><text x="86.1" y="273.5" class="chipt">LangGraph</text></g><g><rect x="140.2" y="256" width="123.4" height="26" rx="13" class="chip"/><text x="201.9" y="273.5" class="chipt">Tesseract OCR</text></g><g><rect x="271.6" y="256" width="53.2" height="26" rx="13" class="chip"/><text x="298.2" y="273.5" class="chipt">Groq</text></g><g><rect x="40" y="290" width="68.8" height="26" rx="13" class="chip"/><text x="74.4" y="307.5" class="chipt">Docker</text></g>
    <g filter="url(#g)"><path d="M348 139H418L438 159V271H348Z" class="win"/><path d="M418 139V159H438" class="win"/>
      <rect x="362" y="163" width="58" height="5" rx="2.5" fill="#C4B5FD" opacity=".45"/><rect x="362" y="178" width="46" height="5" rx="2.5" fill="#C4B5FD" opacity=".45"/><rect x="362" y="193" width="62" height="5" rx="2.5" fill="#C4B5FD" opacity=".45"/><rect x="362" y="208" width="38" height="5" rx="2.5" fill="#C4B5FD" opacity=".45"/><rect x="362" y="223" width="54" height="5" rx="2.5" fill="#C4B5FD" opacity=".45"/><rect x="362" y="238" width="30" height="5" rx="2.5" fill="#C4B5FD" opacity=".45"/>
      <rect x="342" y="139" width="102" height="10" rx="5" fill="url(#scan)" class="scan"/>
      <path d="M444 205H450" class="flow"/>
      <g class="field" style="animation-delay:0.6s"><rect x="456" y="159" width="111.6" height="26" rx="13" class="chip"/><text x="511.8" y="176" class="chipt" style="font-size:12px">type: invoice</text></g><g class="field" style="animation-delay:1.1s"><rect x="456" y="195" width="97.2" height="26" rx="13" class="chip"/><text x="504.6" y="212" class="chipt" style="font-size:12px">total found</text></g><g class="field" style="animation-delay:1.5s"><rect x="456" y="231" width="118.8" height="26" rx="13" class="chip"/><text x="515.4" y="248" class="chipt" style="font-size:12px">confidence .97</text></g></g>
  </g>
</svg>
