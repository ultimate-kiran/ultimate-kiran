<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
  <title id="t">What I build with</title>
  <desc id="d">An exploded isometric stack: Claude for reasoning, LangGraph for agent loops and state, LangChain for tools and integrations, and Python, TypeScript and Node.js underneath.</desc>
  
  <defs>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#1E4A7A" stroke-width="0.6" opacity="0.35"/>
    </pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minor)"/>
      <path d="M100 0H0V100" fill="none" stroke="#1E4A7A" stroke-width="1" opacity="0.6"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#0A2342" stop-opacity="0"/>
      <stop offset="100%" stop-color="#051428" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="520" fill="#0A2342"/>
  <rect width="1200" height="520" fill="url(#major)"/>
  <rect width="1200" height="520" fill="url(#vignette)"/>
  <style>
    .left{fill:#0c2748;stroke:#7FA7D6;stroke-width:1.2}
    .right{fill:#11335d;stroke:#7FA7D6;stroke-width:1.2}
    .top{fill:#143a68;stroke:#E8F1FF;stroke-width:1.4}
    .top.accent{stroke:#FFB000;stroke-width:2}
    .face{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-weight:700;fill:#E8F1FF;opacity:.92}
    .leader{fill:none;stroke:#7FA7D6;stroke-width:1.2;stroke-dasharray:3 4}
    .dot{fill:#FFB000}
    .lname{font:700 24px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#E8F1FF}
    .lwhat{font:400 17px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#7FA7D6}
    .beam{stroke:#FFB000;stroke-width:3;stroke-linecap:round;stroke-dasharray:4 10;animation:beam .9s linear infinite}
    .beamglow{stroke:#FFB000;stroke-width:10;opacity:.12}
    @keyframes beam{to{stroke-dashoffset:-14}}
    .s3 .breath{animation:breathe3 6s ease-in-out infinite}@keyframes breathe3{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}.s2 .breath{animation:breathe2 6s ease-in-out infinite}@keyframes breathe2{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}.s1 .breath{animation:breathe1 6s ease-in-out infinite}@keyframes breathe1{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.s0 .breath{animation:breathe0 6s ease-in-out infinite}@keyframes breathe0{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    @media (prefers-reduced-motion: reduce){.breath,.beam{animation:none!important}}
  </style>
  <line class="beamglow" x1="540.1" y1="147.5" x2="540.1" y2="415.5"/>
  <line class="beam" x1="540.1" y1="147.5" x2="540.1" y2="415.5"/>
  <g class="slab s3" transform="translate(0 252)">
      <g class="breath">
        <polygon class="left" points="264,137.2 426.1,230.8 426.1,218.6 264,125"/>
        <polygon class="right" points="532.1,169.6 426.1,230.8 426.1,218.6 532.1,157.4"/>
        <polygon class="top" points="370,63.8 532.1,157.4 426.1,218.6 264,125"/>
        <text class="face" font-size="15" transform="matrix(0.866 0.5 -0.866 0.5 295.2 123.2)">Python, TS, Node</text>
        <path class="leader" d="M540.1 163.5H698"/>
        <circle class="dot" cx="540.1" cy="163.5" r="3.5"/>
      </g>
      <text class="lname" x="720" y="165.5">Python, TypeScript, Node.js</text>
      <text class="lwhat" x="720" y="191.5">The services the agents run inside</text>
    </g><g class="slab s2" transform="translate(0 168)">
      <g class="breath">
        <polygon class="left" points="264,137.2 426.1,230.8 426.1,218.6 264,125"/>
        <polygon class="right" points="532.1,169.6 426.1,230.8 426.1,218.6 532.1,157.4"/>
        <polygon class="top" points="370,63.8 532.1,157.4 426.1,218.6 264,125"/>
        <text class="face" font-size="22" transform="matrix(0.866 0.5 -0.866 0.5 295.2 123.2)">LangChain</text>
        <path class="leader" d="M540.1 163.5H698"/>
        <circle class="dot" cx="540.1" cy="163.5" r="3.5"/>
      </g>
      <text class="lname" x="720" y="165.5">LangChain</text>
      <text class="lwhat" x="720" y="191.5">Tools, retrievers and model integrations</text>
    </g><g class="slab s1" transform="translate(0 84)">
      <g class="breath">
        <polygon class="left" points="264,137.2 426.1,230.8 426.1,218.6 264,125"/>
        <polygon class="right" points="532.1,169.6 426.1,230.8 426.1,218.6 532.1,157.4"/>
        <polygon class="top" points="370,63.8 532.1,157.4 426.1,218.6 264,125"/>
        <text class="face" font-size="22" transform="matrix(0.866 0.5 -0.866 0.5 295.2 123.2)">LangGraph</text>
        <path class="leader" d="M540.1 163.5H698"/>
        <circle class="dot" cx="540.1" cy="163.5" r="3.5"/>
      </g>
      <text class="lname" x="720" y="165.5">LangGraph</text>
      <text class="lwhat" x="720" y="191.5">Agent loops, shared state, retries, human in the loop</text>
    </g><g class="slab s0" transform="translate(0 0)">
      <g class="breath">
        <polygon class="left" points="264,137.2 426.1,230.8 426.1,218.6 264,125"/>
        <polygon class="right" points="532.1,169.6 426.1,230.8 426.1,218.6 532.1,157.4"/>
        <polygon class="top accent" points="370,63.8 532.1,157.4 426.1,218.6 264,125"/>
        <text class="face" font-size="22" transform="matrix(0.866 0.5 -0.866 0.5 295.2 123.2)">Claude</text>
        <path class="leader" d="M540.1 163.5H698"/>
        <circle class="dot" cx="540.1" cy="163.5" r="3.5"/>
      </g>
      <text class="lname" x="720" y="165.5">Claude</text>
      <text class="lwhat" x="720" y="191.5">Reasoning, tool use and long context</text>
    </g>
</svg>
